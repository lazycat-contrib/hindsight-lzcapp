params:
  - id: llm_provider
    type: string
    name: "LLM Provider"
    description: "LLM provider: openai, anthropic, gemini, groq, deepseek, zai, minimax, ollama, lmstudio, or any OpenAI-compatible gateway"
    default_value: "openai"
    optional: false

  - id: llm_api_key
    type: secret
    name: "LLM API Key"
    description: "API key for the provider. Leave empty for local providers (ollama, lmstudio) or subscription providers (openai-codex, claude-code, github-copilot)"
    default_value: ""
    optional: true

  - id: llm_model
    type: string
    name: "LLM Model"
    description: "Model identifier, for example gpt-4o-mini, claude-sonnet-4, gemini-2.5-flash, deepseek-chat"
    default_value: "gpt-4o-mini"
    optional: true

  - id: llm_base_url
    type: string
    name: "LLM Base URL"
    description: "Optional custom OpenAI-compatible base URL, for example https://api.deepseek.com/v1. Leave empty to use the provider default"
    default_value: ""
    optional: true

  - id: vlm_provider
    type: string
    name: "Vision Model Provider"
    description: "Optional vision slot for chunks that carry image attachments, for example gemini. Leave empty to send attachments to the retain LLM"
    default_value: ""
    optional: true

  - id: vlm_model
    type: string
    name: "Vision Model"
    description: "Optional vision model identifier, for example gemini-2.5-flash"
    default_value: ""
    optional: true

  - id: vlm_api_key
    type: secret
    name: "Vision Model API Key"
    description: "Optional API key for the vision provider"
    default_value: ""
    optional: true

