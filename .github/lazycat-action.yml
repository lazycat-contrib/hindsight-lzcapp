version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: hindsight

build:
  toolchains: []
  run_buildscript: false

images:
  - id: hindsight
    target: service
    service: hindsight
    source: ghcr.io/vectorize-io/hindsight
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: false
    name: Hindsight
    summary: Agent 记忆系统 —— retain / recall / reflect，让 Agent 越用越聪明
